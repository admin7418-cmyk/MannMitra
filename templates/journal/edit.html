{% extends "layouts/base.html" %}{% block content %}<div class="page-head"><div><span class="tag">EDIT REFLECTION</span><h1>Refine your thoughts.</h1><p>Your mood tone will be recalculated when you save.</p></div><a class="text-link" href="{{url_for('journal.journal_page')}}">← Back</a></div><section class="panel composer"><form method="post"><label>Title<input name="title" value="{{journal['title']}}" maxlength="80" required></label><label>Your thoughts<textarea name="body" rows="14" maxlength="4000" required>{{journal['body']}}</textarea></label><div class="form-foot"><span class="badge">Current tone: {{journal['mood']}}</span><button class="btn">Save changes</button></div></form></section>{% endblock %}
